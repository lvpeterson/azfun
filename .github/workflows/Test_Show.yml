name: Run Azure Login with the Service Principal secret
on: [workflow_dispatch]

permissions:
      id-token: write
      contents: read

jobs:
  get-flag:
    runs-on: ubuntu-latest
    steps:
    - name: Azure Login action
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        enable-AzPSSession: true
    
    - name: Download flag
      run: |
          az storage blob download \
            --account-name iamazurelab39874cdaa \
            --container-name flag \
            --name flag.txt \
            --file flag.txt \
            --auth-mode login

    - name: Read flag
      run: cat flag.txt
